<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow" />
    <title>Portfolio</title>
    <meta name="description" content="Personal portfolio and engineering showcase." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta name="theme-color" content="#090a0f" />
    
    <!-- Instant theme initialization before paint -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('pf_theme') || 'dark';
          document.documentElement.setAttribute('data-theme', saved);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', saved === 'dark' ? '#090a0f' : '#ffffff');
        } catch (e) {}
      })();
    </script>

    <!-- Space Grotesk & Inter typography -->
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
